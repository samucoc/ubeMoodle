version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: moodlenext-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: moodlenext
      POSTGRES_USER: moodlenext
      POSTGRES_PASSWORD: moodlenext_secret_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodlenext -d moodlenext"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moodlenext-network

  # ============================================
  # Redis Cache & Queue
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: moodlenext-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moodlenext-network

  # ============================================
  # Backend API (NestJS + Fastify)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: moodlenext-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      APP_NAME: MoodleNext
      APP_PORT: 4000
      APP_ENV: production
      APP_FRONTEND_URL: http://localhost:3000
      APP_CORS_ORIGINS: http://localhost:3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: moodlenext
      DB_PASSWORD: moodlenext_secret_2024
      DB_DATABASE: moodlenext
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TTL: 3600
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-jwt-key-in-production-min-32}
      JWT_EXPIRATION: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-refresh-secret-in-production-min-32}
      JWT_REFRESH_EXPIRATION: 7d
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 100
      BULL_REDIS_HOST: redis
      BULL_REDIS_PORT: 6379
      DB_POOL_MAX: 20
      DB_POOL_MIN: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - moodlenext-network

  # ============================================
  # Frontend (Next.js)
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: moodlenext-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:4000
      NEXT_PUBLIC_APP_NAME: MoodleNext
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - moodlenext-network

  # ============================================
  # Nginx Reverse Proxy (Production)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: moodlenext-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    depends_on:
      - frontend
      - backend
    networks:
      - moodlenext-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  nginx_cache:
    driver: local

networks:
  moodlenext-network:
    driver: bridge
